services:
  postgres:
    image: postgres:16-alpine
    container_name: tarifwerk-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tarifwerk
      POSTGRES_PASSWORD: tarifwerk-local
      POSTGRES_DB: tarifwerk
    ports:
      - "5432:5432"
    volumes:
      - tarifwerk-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tarifwerk -d tarifwerk"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  tarifwerk-postgres-data:
